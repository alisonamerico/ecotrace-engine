apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecotrace-worker
  namespace: ecotrace
  labels:
    app.kubernetes.io/name: ecotrace-worker
    app.kubernetes.io/part-of: ecotrace-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecotrace-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecotrace-worker
        app.kubernetes.io/part-of: ecotrace-engine
    spec:
      containers:
        - name: worker
          image: ghcr.io/ecotrace/ecotrace-engine:latest
          command: ["uv", "run", "celery", "-A", "app.workers.celery_app:celery_app", "worker", "-l", "info", "-Q", "ecotrace.invoices", "-c", "4"]
          envFrom:
            - configMapRef:
                name: ecotrace-config
            - secretRef:
                name: ecotrace-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
