apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecotrace-ingress
  namespace: ecotrace
  labels:
    app.kubernetes.io/part-of: ecotrace-engine
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ecotrace-api.example.com
      secretName: ecotrace-tls
  rules:
    - host: ecotrace-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecotrace-api
                port:
                  number: 8081
