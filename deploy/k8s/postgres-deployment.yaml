apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecotrace-postgres
  namespace: ecotrace
  labels:
    app.kubernetes.io/name: ecotrace-postgres
    app.kubernetes.io/part-of: ecotrace-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ecotrace-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecotrace-postgres
        app.kubernetes.io/part-of: ecotrace-engine
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ecotrace-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecotrace-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ecotrace-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ecotrace"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecotrace"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: ecotrace-postgres-pvc
